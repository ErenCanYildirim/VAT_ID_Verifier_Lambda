name: Simple Code Quality

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 safety
          pip install -r requirements.txt

      - name: Check code formatting with Black
        run: |
          black --check --line-length=88 .

      - name: Lint with Flake8
        run: |
          # Only fail on critical issues: syntax errors, undefined names, unused imports
          flake8 . --count --select=E9,F63,F7,F82,F401 --show-source --statistics

      - name: Style check 
        run: |
          #report style issues, don't fail build
          flake8 . --count --max-complexity=15 --max-line-length=100 --statistics --ignore=E203,W503,F841 || echo "Style issues found but not blocking build"

      - name: Security check with Safety
        run: |
          safety check --json || echo "Security issues found, check logs"
          safety check

      - name: Python syntax check
        run: |
          python -m py_compile lambda_function.py
          python -m py_compile tests/*.py