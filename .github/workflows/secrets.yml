name: Secrets scanner

on:
    push:
        branches: [ main, dev ]
    pull_request:
        branches: [ main, dev ]

jobs:
    secrets-scan:
        name: Scan for secrets
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
            with:
                fetch-depth: 0
        
          - name: Run TruffleHog
            uses: trufflesecurity/trufflehog@main
            with:
                path: ./
                base: main
                head: HEAD
                extra_args: --only-verified

          - name: Run GitLeaks
            uses: gitleaks/gitleaks-action@v2
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
          - name: Scan Python and Terraform files
            run: |
                echo "Scanning for secrets in python and terraform files"

                echo "===Python ==="
                if find . -name "*.py" -type f -exec grep -Hn -E "(api_key|secret_key|password|token)\s*=\s*['\"][^'\"]{8,}" {} \; 2>/dev/null | head -10; then
                    echo " Found potential secrets in Python files"
                    exit 1
                fi

                echo "===AWS==="
                if grep -r -E "AKIA[0-9A-Z]{16}" . --exclude-dir=.git 2>/dev/null; then
                    echo "Found AWS access key"
                    exit 1
                fi

                echo "===GitHub tokens==="
                if grep -r -E "ghp_[A-Za-z0-9]{36}" . --exclude-dir=.git 2>/dev/null; then
                    echo "Found GitHub token"
                    exit 1
                fi

                echo "=== High Entropy Strings ==="
                if grep -r -E "['\"][A-Za-z0-9+/=]{32,}['\"]" . --exclude-dir=.git --include="*.py" --include="*.tf" 2>/dev/null | head -5; then
                    echo "Found high entropy strings (review manually)"
                fi
                
                echo "Scan complete"