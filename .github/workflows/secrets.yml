name: Secrets scanner

on:
    push:
        branches: [ main, dev ]
    pull_request:
        branches: [ main, dev ]

jobs:
    secrets-scan:
        name: Scan for secrets
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
            with:
                fetch-depth: 0
        
          - name: Run TruffleHog
            uses: trufflesecurity/trufflehog@main
            with:
                path: ./
                base: main
                head: HEAD
                extra_args: --only-verified

          - name: Run GitLeaks
            uses: gitleaks/gitleaks-action@v2
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
          - name: Scan Python and Terraform files
            run: |
                echo "Scanning for secrets in Python and Terraform files..."
                
                # Python files - look for hardcoded secrets
                echo "=== Python Files ==="
                python_results=$(find . -name "*.py" -type f -exec grep -Hn -E "(api_key|secret_key|password|token)\s*=\s*['\"][^'\"]{8,}" {} \; 2>/dev/null | head -10)
                if [ -n "$python_results" ]; then
                    echo "Found potential secrets in Python files:"
                    echo "$python_results"
                    exit 1
                fi
                
                # Terraform files - look for hardcoded values
                echo "=== Terraform Files ==="
                tf_results=$(find . -name "*.tf" -name "*.tfvars" -type f -exec grep -Hn -E "(password|secret|token|key)\s*=\s*['\"][^'\"]{8,}" {} \; 2>/dev/null | head -10)
                if [ -n "$tf_results" ]; then
                    echo "Found potential secrets in Terraform files:"
                    echo "$tf_results"
                    exit 1
                fi
                
                # AWS keys anywhere
                echo "=== AWS Keys ==="
                aws_results=$(grep -rn -E "AKIA[0-9A-Z]{16}" . --exclude-dir=.git 2>/dev/null)
                if [ -n "$aws_results" ]; then
                    echo "Found AWS Access Key:"
                    echo "$aws_results"
                    exit 1
                fi
                
                # GitHub tokens
                echo "=== GitHub Tokens ==="
                gh_results=$(grep -rn -E "ghp_[A-Za-z0-9]{36}" . --exclude-dir=.git 2>/dev/null)
                if [ -n "$gh_results" ]; then
                    echo "Found GitHub token:"
                    echo "$gh_results"
                    exit 1
                fi
                
                # High entropy strings (potential secrets)
                echo "=== High Entropy Strings ==="
                entropy_results=$(grep -rn -E "['\"][A-Za-z0-9+/=]{32,}['\"]" . --exclude-dir=.git --include="*.py" --include="*.tf" 2>/dev/null | head -5)
                if [ -n "$entropy_results" ]; then
                    echo "Found high entropy strings (review manually):"
                    echo "$entropy_results"
                fi
                
                echo "Scan complete"
            continue-on-error: true